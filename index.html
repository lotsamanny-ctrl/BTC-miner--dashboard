<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin & Multi-Pool Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    header h1 { font-size: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; backdrop-filter: blur(10px); }
    .card-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .card-value { font-size: 1.5rem; font-weight: bold; color: var(--text); }
    
    .wallet-section { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input[type="text"] { background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 8px; flex-grow: 1; font-size: 0.95rem; }
    button { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }

    .pool-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
    
    .iframe-container { width: 100%; height: 550px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Bitcoin & Multi-Pool Dashboard</h1>
      <span style="color: var(--success); font-size: 0.9rem;">● System Online</span>
    </header>

    <!-- Network Quick Stats -->
    <div class="grid">
      <div class="card">
        <div class="card-title">BTC Price</div>
        <div class="card-value" id="btc-price">Loading...</div>
      </div>
      <div class="card">
        <div class="card-title">Current Block Height</div>
        <div class="card-value" id="btc-height">Loading...</div>
      </div>
      <div class="card">
        <div class="card-title">Network Difficulty</div>
        <div class="card-value" id="btc-diff">Loading...</div>
      </div>
      <div class="card">
        <div class="card-title">Local Miner Interface</div>
        <div class="card-value" style="font-size: 1.1rem;">
          <a href="http://192.168.254.154" target="_blank" style="color: var(--accent); text-decoration: none;">192.168.254.154 ↗</a>
        </div>
      </div>
    </div>

    <!-- Wallet Address Lookup -->
    <div class="card">
      <div class="card-title">Worker Address Tracker</div>
      <div class="wallet-section">
        <input type="text" id="wallet-input" placeholder="Enter Bitcoin Payout Address (e.g. 3NnsZr...)" />
        <button onclick="updateDashboard()">Update Stats View</button>
      </div>

      <!-- Multi-Pool View Switcher -->
      <div class="pool-tabs">
        <button class="tab-btn active" onclick="switchPool('nmminer')">NMMiner SoloBTC</button>
        <button class="tab-btn" onclick="switchPool('nerdminer')">NerdMiner Pool</button>
        <button class="tab-btn" onclick="switchPool('publicpool')">Public-Pool.io</button>
      </div>

      <div class="iframe-container">
        <iframe id="pool-frame" src="https://solobtc.nmminer.com/"></iframe>
      </div>
    </div>
  </div>

  <script>
    let currentPool = 'nmminer';

    function getWallet() {
      return document.getElementById('wallet-input').value.trim();
    }

    function switchPool(pool) {
      currentPool = pool;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      updateDashboard();
    }

    function updateDashboard() {
      const address = getWallet();
      const frame = document.getElementById('pool-frame');
      
      if (currentPool === 'nmminer') {
        frame.src = address ? `https://solobtc.nmminer.com/#/app/${address}` : `https://solobtc.nmminer.com/`;
      } else if (currentPool === 'nerdminer') {
        frame.src = `https://pool.nerdminer.io/`;
      } else if (currentPool === 'publicpool') {
        frame.src = address ? `https://public-pool.io/#/app/${address}` : `https://public-pool.io/`;
      }
    }

    async function fetchNetworkStats() {
      try {
        const res = await fetch('https://api.blockchain.info/stats');
        const data = await res.json();
        document.getElementById('btc-price').innerText = '$' + data.market_price_usd.toLocaleString();
        document.getElementById('btc-height').innerText = data.n_blocks_total.toLocaleString();
        document.getElementById('btc-diff').innerText = (data.difficulty / 1e12).toFixed(2) + ' T';
      } catch (e) {
        document.getElementById('btc-price').innerText = 'Fetch Error';
        document.getElementById('btc-height').innerText = '---';
        document.getElementById('btc-diff').innerText = '---';
      }
    }

    fetchNetworkStats();
    setInterval(fetchNetworkStats, 60000);
  </script>
</body>
</html>
